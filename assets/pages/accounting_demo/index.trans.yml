    fr: 'Một xưởng tại Pháp — bảng tài khoản của Pháp, khai báo VAT CA3, xuất FEC. Một hóa đơn đã thanh toán, một hóa đơn trễ hạn, một báo giá và một bản nháp, một giao dịch mua, một bảng sao kê ngân hàng để đối chiếu.'
    be: 'Một xưởng tại Bỉ — bảng tài khoản của Bỉ và bảng VAT. Một hóa đơn, một giao dịch mua, một báo giá, và một khoản thanh toán mang theo tham chiếu có cấu trúc của nó.'
  try:
    title: 'Cái gì để thử'
    documents: 'Tài liệu — lọc chúng, mở một tài liệu đã phát hành để đọc PDF của nó, phát hành một hóa đơn tín dụng, sao chép một tài liệu.'
    editor: 'Bản nháp — thêm dòng và xem tổng, dán hàng từ bảng tính, sau đó phát hành nó.'
    bank: 'Ngân hàng — đối chiếu các dòng, chấp nhận một đề xuất, ghi nhận một khoản thanh toán bằng tay, nhập một bảng sao kê.'
    vat: 'VAT — mở một kỳ, đọc các ô của nó, ghi nhận việc thanh toán của nó.'
    close: 'Năm tài chính — kiểm tra năm, sau đó đóng và mở lại nó.'

id:
  page_title: 'Skenario Akuntansi'
  document_title: 'Demo Akuntansi — buku besar Prancis dan Belgia'
  page_description: 'Dua buku besar contoh untuk dijelajahi — bengkel Prancis dan Belgia — dengan faktur, nota kredit, rekonsiliasi bank, SPT PPN, dan tutup tahun buku.'
  page_icon: 'ph:bold/list-checks'
  intro: 'Dua buku kas fiktif, ditulis pada kunjungan pertama Anda. Ubah apa saja: layar adalah yang didapat aplikasi.'
  open: 'Buka buku'
  ledger:
    fr: 'Sebuah bengkel Prancis — daftar akun Prancis, pengembalian PPN CA3, ekspor FEC. Satu faktur dibayar, satu terlambat, sebuah penawaran dan draf, sebuah pembelian, sebuah laporan bank untuk dicocokkan.'
    be: 'Sebuah bengkel Belgia — daftar akun Belgia dan grid PPN. Sebuah faktur, sebuah pembelian, sebuah penawaran, dan sebuah pembayaran dengan referensi terstruktur.'
  try:
    title: 'Apa yang dicoba'
    documents: 'Dokumen — saring mereka, buka yang diterbitkan untuk membaca PDF-nya, terbitkan nota kredit, salin satu.'
    editor: 'Draf — tambahkan baris dan lihat totalnya, tempel baris dari spreadsheet, lalu terbitkan.'
    bank: 'Bank — cocokkan baris, terima proposal, catat pembayaran secara manual, impor laporan.'
    vat: 'PPN — buka periode, baca kolomnya, catat penyelesaiannya.'
    close: 'Tahun fiskal — periksa tahun, lalu tutup dan buka kembali.'

nl:
  page_title: "Boekhoudscenario's"
  document_title: 'Boekhouddemo — een Franse en een Belgische grootboek'
  page_description: "Twee voorbeeldadministraties om te verkennen — een Franse en een Belgische werkplaats — met facturen, creditnota's, bankafstemming, btw-aangiftes en jaarafsluiting."
  page_icon: 'ph:bold/list-checks'
  intro: 'Twee verzonnen grootboeken, geschreven bij je eerste bezoek. Wijzig iets: de schermen zijn die van een applicatie.'
  open: 'Open de boeken'
  ledger:
    fr: 'Een Franse workshop — Franse rekeningenstelsel, CA3 btw-aangiften, FEC-export. Eén factuur betaald, één te laat, een offerte en een concept, een aankoop, een bankafschrift om mee te vergelijken.'
    be: 'Een Belgische workshop — Belgisch rekeningenstelsel en btw-schema. Een factuur, een aankoop, een offerte en een betaling met zijn gestructureerde referentie.'
  try:
    title: 'Wat te proberen'
    documents: 'Documenten — filter ze, open een uitgegeven document om de PDF te lezen, geef een creditnota uit, kopieer er één.'
    editor: 'Het concept — voeg regels toe en bekijk de totalen, plak rijen uit een spreadsheet, en geef het dan uit.'
    bank: 'Bank — match de regels, accepteer een voorstel, registreer een betaling met de hand, importeer een afschrift.'
    vat: 'Btw — open een periode, lees de vakken, boek de afrekening.'
    close: 'Fiscale jaren — controleer het jaar, sluit het dan af en open het opnieuw.'
