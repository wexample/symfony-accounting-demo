en:
  page_title: Accounting scenarios
  document_title: "Accounting demo — a French and a Belgian ledger"
  page_description: "Two sample ledgers to explore — a French and a Belgian workshop — with invoices, credit notes, bank matching, VAT returns and fiscal year closing."
  page_icon: ph:bold/list-checks
  intro: 'Two made-up ledgers, written on your first visit. Change anything: the screens are the ones an application gets.'
  open: Open the books
  ledger:
    fr: A French workshop — French chart of accounts, CA3 VAT returns, FEC export. One invoice paid, one late, a quotation and a draft, a purchase, a bank statement to match.
    be: A Belgian workshop — Belgian chart of accounts and VAT grid. An invoice, a purchase, a quotation, and a payment carrying its structured reference.
  try:
    title: What to try
    documents: Documents — filter them, open an issued one to read its PDF, issue a credit note, copy one.
    editor: The draft — add lines and watch the totals, paste rows from a spreadsheet, then issue it.
    bank: Bank — match the lines, accept a proposal, record a payment by hand, import a statement.
    vat: VAT — open a period, read its boxes, book its settlement.
    close: Fiscal years — check the year, then close and reopen it.

fr:
  page_title: 'Scénarios comptables'
  document_title: 'Démo comptable — un grand livre français et un grand livre belge'
  page_description: "Deux dossiers comptables d'exemple à explorer — un atelier français et un atelier belge — avec factures, avoirs, rapprochement bancaire, déclarations de TVA et clôture d'exercice."
  page_icon: 'ph:bold/list-checks'
  intro: 'Deux livres comptables fictifs, créés lors de votre première visite. Modifiez tout : les écrans sont ceux que vous trouverez dans une application.'
  open: 'Ouvrir les livres'
  ledger:
    fr: 'Un atelier français — plan comptable français, déclarations de TVA CA3, export FEC. Une facture payée, une en retard, un devis et un brouillon, un achat, un relevé bancaire à rapprocher.'
    be: 'Un atelier belge — plan comptable belge et grille de TVA. Une facture, un achat, un devis, et un paiement avec sa référence structurée.'
  try:
    title: 'Que tester'
    documents: 'Documents — filtrez-les, ouvrez un document émis pour lire son PDF, émettez une note de crédit, en copiez un.'
    editor: 'Le brouillon — ajoutez des lignes et regardez les totaux, collez des lignes depuis un tableur, puis émettez-le.'
    bank: 'Banque — rapprochez les lignes, acceptez une proposition, enregistrez un paiement manuellement, importez un relevé.'
    vat: 'TVA — ouvrez une période, lisez ses cases, comptabilisez son règlement.'
    close: "Exercices fiscaux — vérifiez l'année, puis fermez-la et rouvrez-la."

zh:
  page_title: 会计场景
  document_title: '会计演示 — 法国和比利时的账本'
  page_description: 两个可探索的示例账本——一家法国作坊和一家比利时作坊——包含发票、贷项通知单、银行对账、增值税申报和年度结账。
  page_icon: 'ph:bold/list-checks'
  intro: 两个虚构的账簿，在您第一次访问时创建。可以随意更改：这些屏幕就是应用程序所使用的。
  open: 打开账簿
  ledger:
    fr: '一个法国工作坊 — 法国会计科目表，CA3增值税申报，FEC导出。一个已支付的发票，一个逾期的发票，一个报价和一个草稿，一个采购，一个银行对账单。'
    be: '一个比利时工作坊 — 比利时会计科目表和增值税表格。一个发票，一个采购，一个报价，以及带有结构化参考的付款。'
  try:
    title: 尝试内容
    documents: '文档 — 过滤它们，打开一个已发出的文档以查看其PDF，开具贷项通知单，复制一个。'
    editor: '草稿 — 添加行并观察总计，从电子表格粘贴行，然后发出它。'
    bank: '银行 — 匹配行，接受提议，手动记录付款，导入对账单。'
    vat: '增值税 — 打开一个期间，查看其框，记账其结算。'
    close: '财政年度 — 检查年份，然后关闭并重新打开。'

ar:
  page_title: 'سيناريوهات المحاسبة'
  document_title: 'عرض المحاسبة - دفتر أستاذ فرنسي وبلجيكي'
  page_description: 'سجلّان نموذجيان للاستكشاف — ورشة فرنسية وأخرى بلجيكية — مع الفواتير، والإشعارات الدائنة، والمطابقة البنكية، وإقرارات ضريبة القيمة المضافة، وإقفال السنة المالية.'
  page_icon: 'ph:bold/list-checks'
  intro: 'دفترين خياليين، كُتبا في زيارتك الأولى. غيّر أي شيء: الشاشات هي تلك التي تظهر في التطبيق.'
  open: 'فتح السجلات'
  ledger:
    fr: 'ورشة عمل فرنسية — المخطط المحاسبي الفرنسي، إقرارات ضريبة القيمة المضافة CA3، تصدير FEC. فاتورة مدفوعة، واحدة متأخرة، عرض سعر ومسوّدة، شراء، كشف حساب بنكي للمطابقة.'
    be: 'ورشة عمل بلجيكية — المخطط المحاسبي البلجيكي وشبكة ضريبة القيمة المضافة. فاتورة، شراء، عرض سعر، ودفع يحمل مرجعه المنظم.'
  try:
    title: 'ماذا تجرب'
    documents: 'المستندات — قم بتصفية المستندات، افتح واحدة صادرة لقراءة PDF الخاصة بها، أصدر فاتورة ائتمان، انسخ واحدة.'
    editor: 'المسوّدة — أضف سطورًا وشاهد الإجماليات، ألصق صفوفًا من جدول بيانات، ثم أصدرها.'
    bank: 'البنك — طابق السطور، وافق على اقتراح، سجل دفعة يدويًا، استورد كشف حساب.'
    vat: 'ضريبة القيمة المضافة — افتح فترة، اقرأ صناديقها، احجز تسويتها.'
    close: 'السنوات المالية — تحقق من السنة، ثم أغلقها وأعد فتحها.'

hi:
  page_title: 'लेखांकन परिदृश्य'
  document_title: 'लेखांकन डेमो — एक फ्रांसीसी और एक बेल्जियन खाता'
  page_description: 'खोजने के लिए दो नमूना लेजर — एक फ़्रांसीसी और एक बेल्जियाई कार्यशाला — चालान, क्रेडिट नोट, बैंक मिलान, VAT रिटर्न और वित्तीय वर्ष समापन के साथ।'
  page_icon: 'ph:bold/list-checks'
  intro: 'आपकी पहली यात्रा पर लिखी गई दो काल्पनिक लेजर। कुछ भी बदलें: स्क्रीन वही हैं जो एक एप्लिकेशन प्राप्त करता है।'
  open: 'किताबें खोलें'
  ledger:
    fr: 'एक फ्रांसीसी कार्यशाला — फ्रांसीसी खाता चार्ट, CA3 VAT रिटर्न, FEC निर्यात। एक चालान का भुगतान किया गया, एक देर से, एक उद्धरण और एक मसौदा, एक खरीद, एक बैंक स्टेटमेंट मिलाने के लिए।'
    be: 'एक बेल्जियन कार्यशाला — बेल्जियन खाता चार्ट और VAT ग्रिड। एक चालान, एक खरीद, एक उद्धरण, और एक भुगतान जिसमें इसका संरचित संदर्भ है।'
  try:
    title: 'क्या आजमाएं'
    documents: 'दस्तावेज़ — उन्हें फ़िल्टर करें, पढ़ने के लिए एक जारी किया गया खोलें, एक क्रेडिट नोट जारी करें, एक की कॉपी करें।'
    editor: 'मसौदा — पंक्तियाँ जोड़ें और कुल देखें, एक स्प्रेडशीट से पंक्तियाँ पेस्ट करें, फिर इसे जारी करें।'
    bank: 'बैंक — पंक्तियों का मिलान करें, एक प्रस्ताव स्वीकार करें, हाथ से भुगतान रिकॉर्ड करें, एक स्टेटमेंट आयात करें।'
    vat: 'VAT — एक अवधि खोलें, इसके बॉक्स पढ़ें, इसके निपटान की बुकिंग करें।'
    close: 'वित्तीय वर्ष — वर्ष की जांच करें, फिर इसे बंद करें और फिर से खोलें।'

he:
  page_title: 'תסריטי חשבונאות'
  document_title: 'דמו חשבונאי — פנקס צרפתי ופנקס בלגי'
  page_description: 'שני פנקסים לדוגמה לחקירה — סדנה צרפתית וסדנה בלגית — עם חשבוניות, הודעות זיכוי, התאמות בנק, דוחות מע״מ וסגירת שנת כספים.'
  page_icon: 'ph:bold/list-checks'
  intro: 'שני יומני דמה, שנכתבו בביקור הראשון שלך. שנה הכל: המסכים הם אלה שהיישום מקבל.'
  open: 'פתח את הספרים'
  ledger:
    fr: 'סדנה צרפתית — תוכנית חשבונות צרפתית, החזרי מע"מ CA3, ייצוא FEC. חשבונית אחת ששולמה, אחת מאוחרת, הצעת מחיר וטיוטה, רכישה, דוח בנק להתאמה.'
    be: 'סדנה בלגית — תוכנית חשבונות בלגית ורשת מע"מ. חשבונית, רכישה, הצעת מחיר, ותשלום עם הפניה מובנית.'
  try:
    title: 'מה לנסות'
    documents: 'מסמכים — סנן אותם, פתח אחד שהונפק כדי לקרוא את ה-PDF שלו, הוצא חשבונית זיכוי, העתק אחד.'
    editor: 'הטיוטה — הוסף שורות וצפה בסכומים, הדבק שורות מגיליון אלקטרוני, ואז הוצא אותה.'
    bank: 'בנק — התאמת השורות, קבלת הצעה, רישום תשלום ידני, ייבוא דוח.'
    vat: 'מע"מ — פתח תקופה, קרא את התיבות שלה, רושם את ההתחשבנות שלה.'
    close: 'שנים פיסקליות — בדוק את השנה, ואז סגור ופתח אותה מחדש.'

fa:
  page_title: 'سناریوهای حسابداری'
  document_title: 'نمایش حسابداری — یک دفتر کل فرانسوی و یک دفتر کل بلژیکی'
  page_description: 'دو دفتر نمونه برای کاوش — یک کارگاه فرانسوی و یک کارگاه بلژیکی — با فاکتورها، یادداشت‌های بستانکار، تطبیق بانکی، اظهارنامه‌های مالیات بر ارزش افزوده و بستن سال مالی.'
  page_icon: 'ph:bold/list-checks'
  intro: 'دو دفتر کل خیالی، نوشته شده در اولین بازدید شما. هر چیزی را تغییر دهید: صفحه‌ها همان‌هایی هستند که یک برنامه دریافت می‌کند.'
  open: 'کتاب‌ها را باز کن'
  ledger:
    fr: 'یک کارگاه فرانسوی — چارت حساب‌های فرانسوی، اظهارنامه VAT CA3، صادرات FEC. یک فاکتور پرداخت شده، یک فاکتور دیرکرد، یک پیش‌فاکتور و یک پیش‌نویس، یک خرید، یک صورت‌حساب بانکی برای تطابق.'
    be: 'یک کارگاه بلژیکی — چارت حساب‌های بلژیکی و جدول VAT. یک فاکتور، یک خرید، یک پیش‌فاکتور، و یک پرداخت با مرجع ساختاری آن.'
  try:
    title: 'چه چیزی را امتحان کنید'
    documents: 'مدارک — آن‌ها را فیلتر کنید، یک مورد صادر شده را باز کنید تا PDF آن را بخوانید، یک یادداشت اعتباری صادر کنید، یک مورد را کپی کنید.'
    editor: 'پیش‌نویس — خطوط را اضافه کنید و جمع‌ها را مشاهده کنید، سطرهایی از یک صفحه‌گسترده را پیست کنید، سپس آن را صادر کنید.'
    bank: 'بانک — خطوط را تطبیق دهید، یک پیشنهاد را قبول کنید، یک پرداخت را به صورت دستی ثبت کنید، یک صورت‌حساب را وارد کنید.'
    vat: 'مالیات بر ارزش افزوده — یک دوره را باز کنید، جعبه‌های آن را بخوانید، تسویه آن را ثبت کنید.'
    close: 'سال‌های مالی — سال را بررسی کنید، سپس آن را ببندید و دوباره باز کنید.'

ur:
  page_title: 'محاسبہ کے منظرنامے'
  document_title: 'محاسبہ کا مظاہرہ — ایک فرانسیسی اور ایک بیلجیی لیجر'
  page_description: 'دیکھنے کے لیے دو نمونہ لیجرز — ایک فرانسیسی اور ایک بیلجیئن ورکشاپ — انوائسز، کریڈٹ نوٹس، بینک مطابقت، VAT گوشواروں اور مالی سال کی بندش کے ساتھ۔'
  page_icon: 'ph:bold/list-checks'
  intro: 'دو فرضی لیجر، آپ کی پہلی وزٹ پر لکھے گئے۔ کچھ بھی تبدیل کریں: یہ وہ اسکرینیں ہیں جو ایک ایپلیکیشن حاصل کرتی ہے۔'
  open: 'کتابیں کھولیں'
  ledger:
    fr: 'ایک فرانسیسی ورکشاپ — فرانسیسی اکاؤنٹس کا چارٹ، CA3 VAT کی واپسی، FEC کی برآمد۔ ایک ادا شدہ رسید، ایک دیر سے، ایک حوالہ اور ایک مسودہ، ایک خریداری، ایک بینک بیان جو ملانا ہے۔'
    be: 'ایک بیلجیئم ورکشاپ — بیلجیئم اکاؤنٹس کا چارٹ اور VAT گرید۔ ایک رسید، ایک خریداری، ایک حوالہ، اور ایک ادائیگی جس کا ساختی حوالہ ہے۔'
  try:
    title: 'کیا آزمانا ہے'
    documents: 'دستاویزات — انہیں فلٹر کریں، ایک جاری شدہ کو پڑھنے کے لیے کھولیں، ایک کریڈٹ نوٹ جاری کریں، ایک کاپی کریں۔'
    editor: 'مسودہ — لائنیں شامل کریں اور ٹوٹل دیکھیں، ایک اسپریڈشیٹ سے قطاریں پیسٹ کریں، پھر اسے جاری کریں۔'
    bank: 'بینک — لائنیں ملائیں، ایک تجویز قبول کریں، ایک ادائیگی کو دستی طور پر ریکارڈ کریں، ایک بیان درآمد کریں۔'
    vat: 'VAT — ایک مدت کھولیں، اس کے خانے پڑھیں، اس کا تصفیہ بک کریں۔'
    close: 'مالی سال — سال چیک کریں، پھر اسے بند کریں اور دوبارہ کھولیں۔'

ja:
  page_title: 会計シナリオ
  document_title: '会計デモ — フランスとベルギーの台帳'
  page_description: '探索できる2つのサンプル帳簿。フランスとベルギーの工房で、請求書、貸方票、銀行照合、VAT 申告、年度締めを試せます。'
  page_icon: 'ph:bold/list-checks'
  intro: 最初の訪問時に作成された2つの架空の台帳。何でも変更できます：画面はアプリケーションが取得するものです。
  open: 帳簿を開く
  ledger:
    fr: 'フランスのワークショップ — フランスの勘定科目表、CA3 VAT申告、FECエクスポート。一つの請求書が支払われ、一つは遅延中、見積書と草案、購入、照合するための銀行口座明細。'
    be: 'ベルギーのワークショップ — ベルギーの勘定科目表とVATグリッド。一つの請求書、一つの購入、一つの見積書、そして構造化された参照を持つ支払い。'
  try:
    title: 試すこと
    documents: 'ドキュメント — フィルターをかけて、発行されたものを開いてPDFを読み、クレジットノートを発行し、一つをコピーします。'
    editor: '草案 — 行を追加し、合計を確認し、スプレッドシートから行を貼り付けて、発行します。'
    bank: '銀行 — 行を照合し、提案を受け入れ、手動で支払いを記録し、明細をインポートします。'
    vat: 'VAT — 期間を開き、そのボックスを読み、清算を記帳します。'
    close: '会計年度 — 年を確認し、閉じて再度開きます。'

ko:
  page_title: '회계 시나리오'
  document_title: '회계 데모 — 프랑스 및 벨기에 원장'
  page_description: '둘러볼 수 있는 두 개의 샘플 장부 — 프랑스와 벨기에의 공방 — 송장, 대변 전표, 은행 대사, 부가세 신고, 회계연도 마감까지.'
  page_icon: 'ph:bold/list-checks'
  intro: '첫 방문 시 작성된 두 개의 가상의 원장입니다. 모든 것을 변경하세요: 화면은 애플리케이션이 표시하는 것입니다.'
  open: '장부 열기'
  ledger:
    fr: '프랑스 워크숍 — 프랑스 계정 차트, CA3 부가가치세 신고서, FEC 내보내기. 하나의 청구서가 지급되었고, 하나는 연체되었으며, 견적서와 초안, 구매, 일치하는 은행 명세서가 있습니다.'
    be: '벨기에 워크숍 — 벨기에 계정 차트 및 부가가치세 그리드. 하나의 청구서, 하나의 구매, 하나의 견적서, 구조화된 참조를 포함한 지불이 있습니다.'
  try:
    title: '시도해 볼 항목'
    documents: '문서 — 필터링하고, 발행된 문서를 열어 PDF를 읽고, 신용 노트를 발행하고, 하나를 복사하세요.'
    editor: '초안 — 항목을 추가하고 총계를 확인하고, 스프레드시트에서 행을 붙여넣은 후 발행하세요.'
    bank: '은행 — 항목을 일치시키고, 제안을 수락하고, 수동으로 지불을 기록하고, 명세서를 가져오세요.'
    vat: '부가가치세 — 기간을 열고, 상자를 읽고, 정산을 예약하세요.'
